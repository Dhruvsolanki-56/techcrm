# Render blueprint: Dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: techsentinals-crm
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    disk:
      name: crm-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: CRM_SECRET
        generateValue: true
